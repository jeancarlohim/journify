  <link rel="stylesheet" href="/styles/tokens.css" />
  <style>
    html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text); font-family: var(--sans); }
    body { -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
    * { box-sizing: border-box; }

    :root {
      --panel: #F4F0E9;
      /* Page-scoped colours used only by the inbox replica. Not design tokens. */
      --tools-brand: 'Fraunces', Georgia, serif;
      --tools-warm:  #B4901C;
      --tools-hot:   #A02231;
      --tools-cold:  #5C7F92;
      --tools-sel:   #F7ECD7;
      --tools-flag:  #F3DEDC;
      --tools-ok:    #2E6B3E;
      --tools-rule:  #C9C3B8;
    }

    ::selection { background: var(--ox); color: var(--bg); }
    section { scroll-margin-top: 80px; }

    /* sticky nav (same behaviour as the homepage and /the-sprint) */
    .j-nav-sticky { position: sticky; top: 0; z-index: 50; background: var(--bg);
      border-bottom: 0.5px solid transparent; transition: border-color 180ms var(--ease); }
    .j-nav-sticky.is-scrolled { border-bottom-color: var(--border); }

    /* drawer overlay */
    .j-page-drawer { position: fixed; inset: 0; z-index: 60; pointer-events: none; }
    .j-page-drawer.is-open { pointer-events: auto; }
    .j-page-drawer .j-overlay { background: rgba(26,23,20,0.40); opacity: 0; transition: opacity 180ms var(--ease); }
    .j-page-drawer.is-open .j-overlay { opacity: 1; }
    .j-page-drawer .j-drawer { transform: translateX(100%); transition: transform 240ms var(--ease); }
    .j-page-drawer.is-open .j-drawer { transform: translateX(0); }

    .j-hamb { display: none; }
    @media (max-width: 768px) {
      .j-nav-links { display: none; }
      .j-hamb { display: inline-flex; }
      .j-nav { padding: 0 24px; height: 56px; }
    }

    /* ── band + inner column ── */
    .j-tools-inner { margin: 0 auto; padding: clamp(70px, 10vh, 110px) clamp(24px, 5vw, 48px); }
    .j-pad-none  { padding: 0; }
    .j-pad-loop  { padding: clamp(60px, 8vh, 96px) clamp(24px, 5vw, 48px); }
    .j-pad-proof { padding: clamp(60px, 8vh, 90px) clamp(24px, 5vw, 48px); }
    .j-pad-close { padding: clamp(90px, 13vh, 150px) clamp(24px, 5vw, 48px); }

    /* ── Hero ── */
    .j-tools-hero { padding: clamp(80px, 12vh, 140px) clamp(24px, 5vw, 48px) clamp(70px, 9vh, 110px); }
    .j-tools-h1 { font-size: clamp(38px, 5.2vw, 64px); line-height: 1.06; letter-spacing: -0.015em;
      max-width: 900px; text-wrap: balance; }
    .j-tools-hero-cols { display: flex; flex-wrap: wrap; gap: clamp(32px, 6vw, 96px);
      margin-top: 44px; align-items: flex-start; }
    .j-tools-hero-aside { flex: 0 1 300px; border-left: 2px solid var(--ox); padding-left: 20px; }

    /* ── The loop ── */
    .j-tools-h2 { font-size: clamp(26px, 3vw, 34px); line-height: 1.16; letter-spacing: -0.012em; }
    .j-tools-stages { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 0; border-top: 0.5px solid var(--tools-rule); }
    .j-tools-stage { padding: 28px clamp(16px, 2vw, 28px) 32px 0;
      border-bottom: 0.5px solid var(--tools-rule); }

    /* ── Tool blocks (Lead Finder / DM 2 Call App / Sally) ── */
    .j-tools-split { display: flex; flex-wrap: wrap; gap: clamp(36px, 5vw, 72px);
      align-items: flex-start; padding: clamp(50px, 7vh, 80px) clamp(24px, 5vw, 48px); }
    .j-tools-split--first { padding-top: clamp(80px, 11vh, 130px); }
    .j-tools-split--last  { padding-bottom: clamp(80px, 11vh, 120px); }
    /* wrap-reverse puts the copy above the visual once the row breaks */
    .j-tools-split--flip { flex-wrap: wrap-reverse; }
    .j-tools-split--flip .j-tools-copy   { order: 2; }
    .j-tools-split--flip .j-tools-visual { order: 1; }

    .j-tools-copy { flex: 1 1 320px; max-width: 440px; position: sticky; top: 108px; }
    .j-tools-copy .j-tools-h2 { font-size: clamp(28px, 3.2vw, 38px); line-height: 1.12; margin-bottom: 10px; }
    .j-tools-lead { font-weight: 500; font-size: 17px; line-height: 1.5; letter-spacing: -0.005em;
      color: var(--text); margin: 0 0 22px; }
    .j-tools-p { font-size: 15px; line-height: 1.7; color: var(--text-2); margin: 0 0 14px; }
    .j-tools-visual { flex: 1.2 1 400px; min-width: 0; max-width: 620px; }
    .j-tools-visual--wide { flex: 1.3 1 420px; max-width: 660px; }

    /* ── Proof ── */
    .j-tools-proofs { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: clamp(28px, 4vw, 48px); }
    .j-tools-big { font-family: var(--display); font-weight: 400;
      font-size: clamp(34px, 3.6vw, 46px); letter-spacing: -0.01em; line-height: 1;
      margin: 0 0 12px; color: var(--text); }

    /* ── Free diagnostic ── */
    .j-tools-diag { display: flex; flex-wrap: wrap; gap: clamp(36px, 5vw, 80px); align-items: flex-start; }
    #diagnostic .j-tools-h2 { font-size: clamp(28px, 3.4vw, 40px); line-height: 1.14; text-wrap: balance; }
    .j-tools-cta-invert { background: var(--bg); color: var(--ox); font-weight: 500; font-size: 15px; padding: 14px 22px; }
    .j-tools-cta-invert:hover { background: #FFFFFF; }

    /* ── Trust ── */
    .j-tools-trust { display: flex; flex-wrap: wrap; gap: clamp(36px, 5vw, 80px); }

    /* ── Close ── */
    .j-tools-close-h { font-size: clamp(30px, 4vw, 48px); line-height: 1.1; letter-spacing: -0.015em;
      margin: 0 auto 18px; max-width: 720px; text-wrap: balance; }

    /* ── narrow screens ── */
    @media (max-width: 860px) {
      /* sticky copy columns unstick once the two columns stack */
      .j-tools-copy { position: static; max-width: none; }
      .j-tools-visual, .j-tools-visual--wide { max-width: none; }
      .j-tools-hero-aside { flex: 1 1 auto; }
      .j-tools-stage { padding-right: 0; }
    }
  </style>

</head>
<body>
  <div id="root"></div>
  <script type="text/babel" src="/components/Section.jsx"></script>
  <script type="text/babel" src="/components/Accordion.jsx"></script>
  <script type="text/babel" src="/components/StickyNav.jsx"></script>
  <script type="text/babel" src="/components/MobileDrawer.jsx"></script>
  <script type="text/babel" src="/components/Footer.jsx"></script>
  <script type="text/babel" src="/tools/InboxMock.jsx"></script>
  <script type="text/babel" src="/pages/ToolsPage.jsx"></script>
  <script type="text/babel">
    function App() {
      const [drawerOpen, setDrawerOpen] = React.useState(false);
      return (
        <React.Fragment>
          <StickyNav onOpenDrawer={() => setDrawerOpen(true)} ctaHref={TOOLS_APPLY} brandHref="/" />
          <main>
            <ToolsPage />
          </main>
          <Footer />
          <MobileDrawer open={drawerOpen} onClose={() => setDrawerOpen(false)} ctaHref={TOOLS_APPLY} />
        </React.Fragment>
      );
    }

    document.fonts.ready.then(function() {
      ReactDOM.createRoot(document.getElementById("root")).render(<App />);
    });
  </script>
